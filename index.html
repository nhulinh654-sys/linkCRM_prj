<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkFlow CRM - Prototype M4 Hôm nay & Ghi nhanh, M2 Lead (T-21, T-22)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f172a;--navy2:#1e293b;--acc:#2563eb;--accbg:#eff6ff;--bg:#f4f6fa;--line:#e2e8f0;--tx:#0f172a;--mut:#64748b;--red:#dc2626;--redbg:#fef2f2;--grn:#16a34a;--grnbg:#f0fdf4;--amb:#d97706;--ambbg:#fffbeb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--tx);background:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
.side{width:220px;background:var(--navy);color:#cbd5e1;flex:none;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;color:#fff;font-size:16px;padding:6px 8px 18px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:20px;background:var(--acc);border-radius:3px;display:inline-block}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:0;background:none;width:100%;text-align:left;color:#cbd5e1}
.nav:hover{background:var(--navy2)}
.nav.on{background:var(--acc);color:#fff}
.nav.dis{opacity:.45;cursor:not-allowed}
.nav .bd{margin-left:auto;font-size:11px;font-weight:600;border-radius:10px;padding:1px 7px;background:#475569;color:#fff}
.nav .bd.red{background:var(--red)}
.nav svg{width:16px;height:16px;flex:none}
.sidefoot{margin-top:auto;font-size:11px;color:#94a3b8;line-height:1.5;padding:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .sp{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.ctl select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-size:13px}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
.np{position:absolute;right:24px;top:56px;width:340px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.15);z-index:20;max-height:380px;overflow:auto}
.np h4{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
.np div.it{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.np div.it small{display:block;color:var(--mut);margin-top:2px}
.content{padding:20px 24px 40px;max-width:1180px;width:100%}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;border:1px solid var(--line);background:#fff}
.banner.info{background:var(--accbg);border-color:#bfdbfe;color:#1e40af}
.banner.warn{background:var(--ambbg);border-color:#fde68a;color:#92400e}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card small{color:var(--mut);display:block;margin-bottom:4px}
.card b{font-size:24px}
.card.red b{color:var(--red)}
.sec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.sec>h3{margin:0;padding:12px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#fafbfd}
.sec>h3.red{color:var(--red);background:var(--redbg)}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}.row.click:hover{background:#f8fafc}
.row.od{background:#fffafa}
.tm{min-width:64px;font-weight:600;font-variant-numeric:tabular-nums}
.od .tm{color:var(--red)}
.grow{flex:1;min-width:0}
.grow b{display:block}
.grow small{color:var(--mut)}
.late{color:var(--red);font-weight:600;font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:#f1f5f9}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{background:#1d4ed8}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;background:#e2e8f0;color:#334155}
.tag.red{background:var(--redbg);color:var(--red)}.tag.grn{background:var(--grnbg);color:var(--grn)}.tag.amb{background:var(--ambbg);color:var(--amb)}.tag.blu{background:var(--accbg);color:var(--acc)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-align:left;color:var(--mut);font-weight:600;padding:10px 14px;background:#fafbfd;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.od td{background:#fffafa}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:500}
.tab.on{color:var(--acc);border-color:var(--acc);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--accbg);border-bottom:1px solid #bfdbfe;flex-wrap:wrap}
.bar select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:#fff;border-radius:14px;width:520px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh b{font-size:16px;flex:1}
.mh .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
.mb{padding:16px 18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:#334155}
.fld i{color:var(--red);font-style:normal}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fld select,.fld input[type=time],.fld textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.fld textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 130px;gap:8px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:4px}
.timer{font-size:12px;background:#f1f5f9;border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums;color:var(--mut)}
.timer.ok{background:var(--grnbg);color:var(--grn)}.timer.bad{background:var(--redbg);color:var(--red)}
.fixed{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:#fff;box-shadow:-10px 0 30px rgba(15,23,42,.18);z-index:40;display:flex;flex-direction:column}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .db{padding:16px 18px;overflow:auto;flex:1}
.log{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.log .lt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.log small{color:var(--mut)}
.deals{display:flex;flex-direction:column;gap:6px;margin:10px 0 16px}
.deal{display:flex;gap:8px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;z-index:99;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:var(--red)}
.sum{background:var(--grnbg);border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.7}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.legend{font-size:12px;color:var(--mut);padding:10px 4px}
@media(max-width:820px){.side{display:none}.row{flex-wrap:wrap}.tm{width:auto}}
</style>
</head>
<body>

<script>
/* ===== Thời gian demo: phút tuyệt đối. Tuần 0 = tuần trước, tuần 1 = tuần hiện tại ===== */
const D=1440, DAYS=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ nhật'];
const T=(w,d,h,m)=>w*7*D+d*D+h*60+m;
const dow=t=>Math.floor(t/D)%7, tod=t=>t%D, dayIdx=t=>Math.floor(t/D);
const p2=n=>String(n).padStart(2,'0');
const hhmm=t=>p2(Math.floor(tod(t)/60))+':'+p2(tod(t)%60);
const fmt=t=>DAYS[dow(t)]+' '+hhmm(t);
const dur=m=>{m=Math.max(0,Math.round(m));if(m<60)return m+' phút';if(m<D){const h=Math.floor(m/60),r=m%60;return h+' giờ'+(r?' '+r+' phút':'')}const d=Math.floor(m/D),h=Math.floor((m%D)/60);return d+' ngày'+(h?' '+h+' giờ':'')};
/* Giờ làm việc giả định 08:00-17:00, thứ Hai-thứ Sáu; hạn phân bổ = 2 giờ làm việc (A-13) */
function norm(t){for(;;){const d=dow(t),tm=tod(t);if(d>=5){t=(dayIdx(t)+(7-d))*D+480;continue}if(tm<480){t=dayIdx(t)*D+480;continue}if(tm>=1020){t=(dayIdx(t)+1)*D+480;continue}return t}}
function addWork(t,mins){t=norm(t);while(mins>0){const end=dayIdx(t)*D+1020,av=end-t;if(mins<=av)return t+mins;mins-=av;t=norm(end)}return t}
const PRESETS=[['Thứ Ba 14:30 (mặc định)',T(1,1,14,30)],['Thứ Ba 15:01 (việc 15:00 vừa quá hạn)',T(1,1,15,1)],['Thứ Ba 15:31',T(1,1,15,31)],['Thứ Sáu 21:00 (tuần trước)',T(0,4,21,0)],['Thứ Hai 09:59',T(1,0,9,59)],['Thứ Hai 10:00',T(1,0,10,0)]];

/* ===== Dữ liệu mẫu (giả định, không phải dữ liệu thật) ===== */

 tp:{label:'Trưởng phòng KD',short:'Trưởng phòng KD',kind:'tp'},
 lan:{label:'Lan · Nhân viên KD',short:'Lan',kind:'nv'},

 cskh:{label:'CSKH',short:'CSKH',kind:'cskh'},
 gd:{label:'Giám đốc (chỉ xem)',short:'Giám đốc',kind:'gd'}};
const EMP={lan:{name:'Lan',active:true},hung:{name:'Hùng',active:true},mai:{name:'Mai',active:true}};
const CHANNELS=['Gọi điện','Zalo','Gặp trực tiếp','Email'];
const RESULTS=['Quan tâm','Cần báo giá','Cần cân nhắc','Từ chối'];

let custs=[
 {id:'c1',name:'Công ty TNHH An Phát',contact:'Chị Hạnh',phone:'0901 111 001',owner:'lan',stage:'Đang chăm sóc'},
 {id:'c2',name:'Cửa hàng Minh Châu',contact:'Anh Tuấn',phone:'0901 111 002',owner:'lan',stage:'Đang chăm sóc'},

 {id:'c7',name:'Công ty CP Gia Huy',contact:'Anh Huy',phone:'0903 555 777',owner:'mai',stage:'Đã ký'}];
let deals=[
 {id:'d1',cust:'c1',name:'Gói CRM 10 user',stage:'Báo giá',owner:'lan'},
 {id:'d2',cust:'c1',name:'Gói đào tạo nhân viên',stage:'Đã ký',owner:'lan'},
 {id:'d3',cust:'c2',name:'Gói CRM 3 user',stage:'Liên hệ',owner:'lan'},

 {id:'d9',cust:'c7',name:'Gói CRM 8 user',stage:'Đã ký',owner:'mai'}];

 {id:'g1',cust:'c1',deal:'d1',t:T(1,0,15,20),by:'Lan',ch:'Gọi điện',rs:'Cần báo giá',note:'Khách hỏi giá cho 10 user, cần báo giá trước thứ Tư.',next:T(1,1,15,0)},
 {id:'g2',cust:'c1',deal:'d2',t:T(0,3,10,0),by:'Lan',ch:'Gặp trực tiếp',rs:'Quan tâm',note:'Chốt gói đào tạo.',next:null},
 {id:'g3',cust:'c3',deal:'d4',t:T(1,0,9,40),by:'Lan',ch:'Zalo',rs:'Cần cân nhắc',note:'Giám đốc muốn so sánh với nhà cung cấp khác.',next:T(1,1,15,30)},

 {id:'g7',cust:'c7',deal:'d9',t:T(0,1,9,0),by:'Mai',ch:'Gọi điện',rs:'Quan tâm',note:'',next:null}];
let tasks=[
 {id:'t1',owner:'lan',cust:'c2',deal:'d3',text:'Gọi lại',due:T(1,0,10,0),status:'todo'},
 {id:'t2',owner:'lan',cust:'c4',deal:'d6',text:'Gọi lại',due:T(1,1,9,0),status:'done',doneAt:T(1,1,9,5)},
 {id:'t3',owner:'lan',cust:'c1',deal:'d1',text:'Gọi lại',due:T(1,1,11,0),status:'done',doneAt:T(1,1,11,2)},
 {id:'t4',owner:'lan',cust:'c1',deal:'d1',text:'Gọi lại',due:T(1,1,15,0),status:'todo'},
 {id:'t5',owner:'lan',cust:'c3',deal:'d4',text:'Gọi lại',due:T(1,1,15,30),status:'todo'},
 {id:'t6',owner:'lan',cust:'c3',deal:'d5',text:'Gọi lại',due:T(1,1,16,0),status:'todo'},
 {id:'t7',owner:'lan',cust:'c2',deal:'d3',text:'Gọi lại',due:T(1,2,9,0),status:'todo'},
 {id:'t8',owner:'hung',cust:'c5',deal:'d7',text:'Gọi lại',due:T(1,1,14,45),status:'todo'},
 {id:'t9',owner:'hung',cust:'c6',deal:'d8',text:'Gọi lại',due:T(1,1,16,30),status:'todo'}];
let leads=[
 {id:'l1',name:'Trần Quốc Bảo',co:'Cty Bảo Long',phone:'0912 000 101',src:'Facebook Ads',camp:'Khai trương T11',t:T(0,4,20,0),st:'Mới'},
 {id:'l2',name:'Lê Thu Hà',co:'Spa Hà Anh',phone:'0912 000 102',src:'Google Ads',camp:'Từ khóa CRM',t:T(1,1,9,0),st:'Mới'},
 {id:'l3',name:'Phạm Văn Nam',co:'Nội thất Nam Phát',phone:'0912 000 103',src:'Zalo OA',camp:'Giới thiệu',t:T(1,1,13,0),st:'Mới'},
 {id:'l4',name:'Đỗ Minh Châu',co:'Gạch men Đại Việt',phone:'0912 000 104',src:'Webinar',camp:'Bán hàng với CRM',t:T(1,1,13,45),st:'Mới'},
 {id:'l5',name:'Vũ Hoàng Yến',co:'Văn phòng phẩm Yến Linh',phone:'0912 000 105',src:'Hotline',camp:'Chưa xác định',t:T(1,1,14,20),st:'Mới'},
 {id:'l6',name:'Nguyễn Anh Huy',co:'Cty CP Gia Huy',phone:'0903 555 777',src:'Facebook Ads',camp:'Khai trương T11',t:T(1,1,10,0),st:'Đã phân bổ',owner:'mai',at:T(1,1,10,0),old:true},
 {id:'l7',name:'Hoàng Mai Lan',co:'Studio Lan Anh',phone:'0912 000 107',src:'Google Ads',camp:'Từ khóa CRM',t:T(1,0,14,0),st:'Đã phân bổ',owner:'lan',at:T(1,0,15,30)},
 {id:'l8',name:'Bùi Đức Thịnh',co:'Cơ khí Thịnh Phát',phone:'0912 000 108',src:'Zalo OA',camp:'Giới thiệu',t:T(1,0,16,0),st:'Đã phân bổ',owner:'hung',at:T(1,1,8,30)}];
let notifs=[];

/* ===== State ===== */
const S={role:'lan',page:'today',tab:'queue',sel:new Set(),now:PRESETS[0][1],drawer:null,drawerDeal:'',notif:false,assignTo:'',redist:{from:'lan',to:'hung',sel:new Set(),sum:null}};
const R=()=>ROLES[S.role], K=()=>R().kind;
const cust=id=>custs.find(c=>c.id===id), deal=id=>deals.find(d=>d.id===id);
const openDeals=cid=>deals.filter(d=>d.cust===cid&&d.stage!=='Đã ký');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Quy tắc / quyền ===== */
const canSeeCust=c=>K()==='nv'?c.owner===S.role:true;
const canLog=c=>K()==='tp'||(K()==='nv'&&c.owner===S.role)||(K()==='cskh'&&c.stage==='Đã ký');
const leadDue=l=>addWork(l.t,120);
const leadOver=l=>l.st==='Mới'&&l.t<=S.now&&S.now>=leadDue(l);
const queue=()=>leads.filter(l=>l.st==='Mới'&&l.t<=S.now).sort((a,b)=>a.t-b.t);
const myTasks=()=>tasks.filter(t=>t.owner===S.role);
const overdueTasks=()=>myTasks().filter(t=>t.status==='todo'&&t.due<S.now).sort((a,b)=>a.due-b.due);
const todayTasks=()=>myTasks().filter(t=>t.status==='todo'&&t.due>=S.now&&dayIdx(t.due)===dayIdx(S.now)).sort((a,b)=>a.due-b.due);
const doneTasks=()=>myTasks().filter(t=>t.status==='done'&&t.doneAt<=S.now&&dayIdx(t.doneAt)===dayIdx(S.now));

/* ===== Tiện ích UI ===== */
const ICON={
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',

 return `<div class="ov" style="background:rgba(15,23,42,.25);justify-content:flex-end;padding:0" data-act="closeDrawer"></div>

 <div class="db"><b style="font-size:13px">Deal</b><div class="deals">${ds.map(d=>`<div class="deal"><span style="flex:1">${esc(d.name)}</span><span class="tag ${d.stage==='Đã ký'?'grn':'amb'}">${d.stage}</span>${d.owner!==c.owner?`<span class="tag">giữ ${esc(ROLES[d.owner].short)}</span>`:''}</div>`).join('')||'<div class="note">Chưa có deal</div>'}</div>
 <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b style="font-size:13px;flex:1">Tương tác (${ls.length})</b>
  ${ds.length>=2?`<select data-chg="drawerDeal" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px"><option value="">Tất cả deal</option>${ds.map(d=>`<option value="${d.id}" ${S.drawerDeal===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:''}
  ${can?`<button class="btn sm pri" data-act="logCust" data-id="${c.id}">Ghi nhanh</button>`:''}</div>

 <div class="fld"><label>Ghi chú (không bắt buộc)</label><textarea id="qlNote" maxlength="500" data-chg="qlNote"></textarea><div class="note" id="qlCnt">0/500</div></div>

 else if(c)h+=`<div class="fld"><label>Khách hàng</label><div class="fixed"><b>${esc(c.name)}</b></div></div>`;

 document.querySelectorAll('#modal .chip').forEach(b=>b.classList.toggle('on',QL[b.dataset.k]===b.dataset.v));

}
function saveQL(){
 const err=m=>{document.getElementById('qlErr').textContent=m;return false};
 if(!QL.cust)return err('Chưa chọn khách hàng.');
 const c=cust(QL.cust);if(!canLog(c))return err('Bạn không có quyền ghi nhanh cho khách này.');
 if(!QL.rs)return err('Chưa chọn kết quả.');
 if(!QL.ch)return err('Chưa chọn kênh.');
 let next=null;
 if(QL.day!==''){const [h,mi]=(QL.time||'').split(':').map(Number);if(isNaN(h))return err('Chưa nhập giờ hẹn.');next=dayIdx(S.now)*D+Number(QL.day)*D+h*60+mi;if(next<=S.now)return err('Giờ hẹn phải sau thời điểm hiện tại.')}
 else if(NEEDS_NEXT.includes(QL.rs))return err('Kết quả “'+QL.rs+'” bắt buộc đặt hẹn lần sau (BR-10).');
 const sec=Math.round((performance.now()-QL.t0)/1000);
 const lg={id:'g'+(logs.length+1),cust:QL.cust,deal:QL.deal||null,t:S.now,by:R().short,ch:QL.ch,rs:QL.rs,note:QL.note.trim(),next};
 logs.push(lg);
 if(next)tasks.push({id:'t'+(tasks.length+1),owner:S.role,cust:QL.cust,deal:QL.deal||null,text:'Gọi lại',due:next,status:'todo',log:lg.id});
 closeModal();render();
 toast('Đã lưu tương tác'+(next?' và tạo việc “Gọi lại” lúc '+fmt(next):'')+'. Thao tác mất '+sec+' giây'+(sec<=30?' (đạt NFR-01, ≤ 30 giây).':' (vượt 30 giây, chưa đạt NFR-01).'),sec>30);
}

let RS=null;

 document.getElementById('modal').innerHTML=`<div class="ov"><div class="md"><div class="mh"><b>Dời hạn việc</b><button class="x" data-act="closeModal">×</button></div><div class="mb">

 <div class="fld"><label>Hạn mới</label><div class="two"><select id="rsDay">${[0,1,2].map(i=>`<option value="${i}" ${i===1?'selected':''}>${['Hôm nay','Ngày mai','Ngày kia'][i]} · ${DAYS[dow(S.now+i*D)]}</option>`).join('')}</select><input type="time" id="rsTime" value="10:00"></div></div>

function saveResched(){
 const t=tasks.find(x=>x.id===RS.id),[h,mi]=document.getElementById('rsTime').value.split(':').map(Number),day=Number(document.getElementById('rsDay').value);
 if(isNaN(h)){document.getElementById('rsErr').textContent='Chưa nhập giờ.';return}

 t.due=nd;closeModal();render();toast('Đã dời hạn sang '+fmt(nd)+'. Việc không còn quá hạn.');
}

 if(S.tab==='redist'&&tp)return view+tabs+viewRedist();
 if(S.tab==='assigned'){
  const as=leads.filter(l=>l.st==='Đã phân bổ'&&l.at<=S.now).sort((a,b)=>b.at-a.at);
  return view+tabs+`<div class="sec">${as.length?`<table><tr><th>Lead</th><th>Điện thoại</th><th>Nguồn/Chiến dịch</th><th>Vào lúc</th><th>Phân bổ lúc</th><th>Thời gian chờ</th><th>Người phụ trách</th></tr>${as.map(l=>`<tr><td><b>${esc(l.name)}</b><br><small style="color:var(--mut)">${esc(l.co)}</small></td><td>${esc(l.phone)}</td><td>${esc(l.src)}<br><small style="color:var(--mut)">${esc(l.camp)}</small></td><td>${fmt(l.t)}</td><td>${fmt(l.at)}</td><td>${dur(l.at-l.t)}</td><td>${tp?`<select data-chg="reassign" data-id="${l.id}" style="border:1px solid var(--line);border-radius:8px;padding:4px 6px">${Object.keys(EMP).filter(e=>EMP[e].active||e===l.owner).map(e=>`<option value="${e}" ${e===l.owner?'selected':''}>${EMP[e].name}</option>`).join('')}</select>`:esc(ROLES[l.owner].short)}${l.old?'<br><span class="tag blu">Khách cũ</span> <small style="color:var(--mut)">tự gán theo SĐT</small>':''}</td></tr>`).join('')}</table>`:'<div class="empty">Chưa có lead nào được phân bổ</div>'}</div><div class="legend">Khách cũ quay lại qua kênh khác được tự gán cho người đang phụ trách (khớp theo số điện thoại). Trưởng phòng KD vẫn đổi được nếu có tranh chấp.</div>`}
 const sel=[...S.sel].filter(id=>q.some(l=>l.id===id));
 return view+tabs+`<div class="cards"><div class="card"><small>Chờ phân bổ</small><b>${q.length}</b></div><div class="card ${over?'red':''}"><small>Quá hạn</small><b>${over}</b></div><div class="card"><small>Chờ lâu nhất</small><b style="font-size:18px">${q.length?dur(S.now-q[0].t):'-'}</b></div></div>
 <div class="sec">${tp&&q.length?`<div class="bar"><b>Đã chọn ${sel.length} lead</b><select data-chg="assignTo"><option value="">Chọn nhân viên…</option>${Object.keys(EMP).filter(e=>EMP[e].active).map(e=>`<option value="${e}" ${S.assignTo===e?'selected':''}>${EMP[e].name} (${leads.filter(l=>l.owner===e&&l.st==='Đã phân bổ').length} lead đang xử lý)</option>`).join('')}</select><button class="btn pri" data-act="assign" ${sel.length&&S.assignTo?'':'disabled'}>Phân bổ</button><button class="btn sm" data-act="selAll">Chọn tất cả</button></div>`:''}
 ${q.length?`<table><tr>${tp?'<th></th>':''}<th>Lead</th><th>Điện thoại</th><th>Nguồn/Chiến dịch</th><th>Vào lúc</th><th>Đã chờ</th><th>Hạn phân bổ</th></tr>${q.map(l=>leadRow(l,tp)).join('')}</table>`:'<div class="empty">Không có lead chờ phân bổ</div>'}</div>
 <div class="legend">Hạn phân bổ là 2 giờ làm việc kể từ lúc lead vào (giả định giờ làm việc 08:00-17:00, thứ Hai đến thứ Sáu); lead vào ngoài giờ tính từ đầu giờ làm việc kế tiếp. Lead nằm trong hàng chờ cả ngoài giờ, kể cả cuối tuần. Dùng ô “Giờ demo” phía trên để xem lead chuyển sang Quá hạn.</div>`}
function doAssign(){
 const ids=[...S.sel].filter(id=>queue().some(l=>l.id===id));if(!ids.length||!S.assignTo)return;
 if(K()!=='tp'){toast('Chỉ Trưởng phòng KD được phân bổ.',true);return}
 const who=S.assignTo;ids.forEach(id=>{const l=leads.find(x=>x.id===id);l.st='Đã phân bổ';l.owner=who;l.at=S.now});
 notify(who,'Bạn được giao '+ids.length+' lead mới.');
 S.sel.clear();S.assignTo='';render();toast('Đã phân bổ '+ids.length+' lead cho '+EMP[who].name+'. '+EMP[who].name+' nhận thông báo trong ứng dụng.');
}

/* ===== M2: Chia lại khách ===== */
function viewRedist(){
 const r=S.redist,mine=custs.filter(c=>c.owner===r.from),act=Object.keys(EMP).filter(e=>EMP[e].active&&e!==r.from);
 if(!act.includes(r.to))r.to=act[0]||'';
 const sel=[...r.sel].filter(id=>mine.some(c=>c.id===id));
 const locked=!EMP[r.from].active&&mine.length===0;
 return `${r.sum?`<div class="sum">${r.sum}</div>`:''}
 <div class="sec"><div class="bar"><span>Nhân viên cần chia lại</span><select data-chg="rFrom">${Object.keys(EMP).map(e=>`<option value="${e}" ${e===r.from?'selected':''}>${EMP[e].name}${EMP[e].active?'':' (đã nghỉ)'} · ${custs.filter(c=>c.owner===e).length} khách</option>`).join('')}</select>
  <button class="btn sm" data-act="toggleActive">${EMP[r.from].active?'Đánh dấu nghỉ việc':'Đánh dấu đi làm lại'}</button>${locked?'<span class="tag red">Tài khoản đã khóa đăng nhập, dữ liệu lịch sử vẫn giữ</span>':''}</div>
 ${mine.length?`<div class="bar" style="background:#fafbfd;border-color:var(--line)"><b>Đã chọn ${sel.length}/${mine.length} khách</b><span>Chuyển cho</span><select data-chg="rTo">${act.map(e=>`<option value="${e}" ${e===r.to?'selected':''}>${EMP[e].name}</option>`).join('')}</select><button class="btn pri" data-act="redist" ${sel.length&&r.to?'':'disabled'}>Chia lại</button><button class="btn sm" data-act="rAll">Chọn tất cả</button></div>
 <table><tr><th></th><th>Khách hàng</th><th>Deal đang mở</th><th>Deal đã ký</th><th>Việc chưa làm</th></tr>${mine.map(c=>`<tr><td style="width:36px"><input type="checkbox" data-chg="rSel" data-id="${c.id}" ${r.sel.has(c.id)?'checked':''}></td><td><b>${esc(c.name)}</b></td><td>${openDeals(c.id).length}</td><td>${deals.filter(d=>d.cust===c.id&&d.stage==='Đã ký').length}</td><td>${tasks.filter(t=>t.cust===c.id&&t.owner===r.from&&t.status==='todo').length}</td></tr>`).join('')}</table>`:'<div class="empty">'+EMP[r.from].name+' không còn khách nào</div>'}</div>
 <div class="legend">Khi chia lại: hồ sơ và lịch sử chăm sóc giữ nguyên; deal đang mở và việc chưa làm chuyển theo người nhận; deal đã ký giữ người phụ trách cũ để số liệu doanh số không đổi. Chỉ chia cho nhân viên KD đang hoạt động.</div>`}
function doRedist(){
 const r=S.redist,ids=[...r.sel].filter(id=>custs.find(c=>c.id===id&&c.owner===r.from));if(!ids.length||!r.to)return;
 let nd=0,ns=0,nt=0;
 ids.forEach(id=>{const c=cust(id);c.owner=r.to;
  deals.filter(d=>d.cust===id).forEach(d=>{if(d.stage==='Đã ký')ns++;else{d.owner=r.to;nd++}});
  tasks.filter(t=>t.cust===id&&t.owner===r.from&&t.status==='todo').forEach(t=>{t.owner=r.to;nt++})});
 notify(r.to,'Bạn được chia lại '+ids.length+' khách từ '+EMP[r.from].name+'.');
 r.sum='<b>Đã chia lại '+ids.length+' khách từ '+EMP[r.from].name+' cho '+EMP[r.to].name+'.</b><br>'+nd+' deal đang mở chuyển sang '+EMP[r.to].name+' · '+ns+' deal đã ký giữ '+EMP[r.from].name+' · '+nt+' việc chuyển theo, giữ nguyên hạn · lịch sử chăm sóc giữ nguyên.';
 r.sel.clear();render();
}

/* ===== Sự kiện ===== */
const ACT={
 page:d=>{S.page=d.p;S.notif=false;render()},
 bell:()=>{S.notif=!S.notif;render()},
 openCust:d=>{const c=cust(d.id);if(!canSeeCust(c)){toast('Bạn chỉ xem được khách mình phụ trách.',true);return}S.drawer=d.id;S.drawerDeal='';render()},
 closeDrawer:()=>{S.drawer=null;render()},
 done:d=>{const t=tasks.find(x=>x.id===d.id);if(t.owner!==S.role){toast('Chỉ người được giao việc mới hoàn thành được.',true);return}t.status='done';t.doneAt=S.now;render();toast('Đã hoàn thành việc. Việc rời danh sách cần làm.')},
 doneLog:d=>{const t=tasks.find(x=>x.id===d.id);if(t.owner!==S.role){toast('Chỉ người được giao việc mới hoàn thành được.',true);return}t.status='done';t.doneAt=S.now;render();const c=cust(t.cust);if(!canLog(c)){toast('Việc đã xong, nhưng bạn không có quyền ghi nhanh cho khách này.',true);return}openQL({cust:t.cust,deal:t.deal,task:t.id});QL.locked=true;syncQL()},
 resched:d=>openResched(d.id),saveResched:()=>saveResched(),
 newLog:()=>{openQL({})},
 logCust:d=>{openQL({cust:d.id});QL.locked=true;syncQL()},
 qlPick:d=>{QL[d.k]=d.v;document.getElementById('qlErr').textContent='';syncQL()},
 saveQL:()=>saveQL(),closeModal:()=>closeModal(),
 tab:d=>{S.tab=d.t;render()},
 selAll:()=>{queue().forEach(l=>S.sel.add(l.id));render()},
 assign:()=>doAssign(),
 rAll:()=>{custs.filter(c=>c.owner===S.redist.from).forEach(c=>S.redist.sel.add(c.id));render()},
 redist:()=>doRedist(),
 toggleActive:()=>{const e=EMP[S.redist.from];e.active=!e.active;S.redist.sum=null;render()}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(S.notif&&el.dataset.act!=='bell'){S.notif=false}
 ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset,e)});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-chg]');if(!el)return;const v=el.value,k=el.dataset.chg;
 if(k==='role'){S.role=v;S.drawer=null;S.notif=false;S.sel.clear();if(K()==='tp'&&S.page==='lead'&&!['queue','assigned','redist'].includes(S.tab))S.tab='queue';if(K()!=='tp'&&S.tab==='redist')S.tab='queue';render()}
 else if(k==='clock'){S.now=Number(v);S.sel.clear();render()}
 else if(k==='drawerDeal'){S.drawerDeal=v;render()}
 else if(k==='selLead'){el.checked?S.sel.add(el.dataset.id):S.sel.delete(el.dataset.id);render()}
 else if(k==='assignTo'){S.assignTo=v;render()}
 else if(k==='reassign'){const l=leads.find(x=>x.id===el.dataset.id);if(K()!=='tp'){toast('Chỉ Trưởng phòng KD được đổi người phụ trách.',true);render();return}l.owner=v;notify(v,'Bạn được giao lead '+l.name+'.');render();toast('Đã đổi người phụ trách lead sang '+EMP[v].name+'.')}
 else if(k==='rFrom'){S.redist.from=v;S.redist.sel.clear();S.redist.sum=null;render()}
 else if(k==='rTo'){S.redist.to=v;render()}
 else if(k==='rSel'){el.checked?S.redist.sel.add(el.dataset.id):S.redist.sel.delete(el.dataset.id);render()}
 else if(QL&&k==='qlCust'){QL.cust=v;QL.deal='';if(v){const od=openDeals(v);if(od.length===1)QL.deal=od[0].id}syncQL()}
 else if(QL&&k==='qlDeal'){QL.deal=v}
 else if(QL&&k==='qlDay'){QL.day=v;document.getElementById('qlErr').textContent=''}
 else if(QL&&k==='qlTime'){QL.time=v}
});
document.addEventListener('input',e=>{if(QL&&e.target.id==='qlNote'){QL.note=e.target.value;document.getElementById('qlCnt').textContent=QL.note.length+'/500'}});
render();
</script>
</body>
