/* ===== Thời gian demo: phút tuyệt đối. Tuần 0 = tuần trước, tuần 1 = tuần hiện tại ===== */
const D=1440, DAYS=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ nhật'];
const T=(w,d,h,m)=>w*7*D+d*D+h*60+m;
const dow=t=>Math.floor(t/D)%7, tod=t=>t%D, dayIdx=t=>Math.floor(t/D);
const p2=n=>String(n).padStart(2,'0');
const hhmm=t=>p2(Math.floor(tod(t)/60))+':'+p2(tod(t)%60);
const fmt=t=>DAYS[dow(t)]+' '+hhmm(t);
const dur=m=>{m=Math.max(0,Math.round(m));if(m<60)return m+' phút';if(m<D){const h=Math.floor(m/60),r=m%60;return h+' giờ'+(r?' '+r+' phút':'')}const d=Math.floor(m/D),h=Math.floor((m%D)/60);return d+' ngày'+(h?' '+h+' giờ':'')};
/* Giờ làm việc giả định 08:00-17:00, thứ Hai-thứ Sáu; hạn phân bổ = 2 giờ làm việc (A-13) */
function norm(t){for(;;){const d=dow(t),tm=tod(t);if(d>=5){t=(dayIdx(t)+(7-d))*D+480;continue}if(tm<480){t=dayIdx(t)*D+480;continue}if(tm>=1020){t=(dayIdx(t)+1)*D+480;continue}return t}}
function addWork(t,mins){t=norm(t);while(mins>0){const end=dayIdx(t)*D+1020,av=end-t;if(mins<=av)return t+mins;mins-=av;t=norm(end)}return t}

 return `<div class="row click ${over?'od':''}" data-act="openCust" data-id="${c.id}">
  <div class="tm">${over?fmt(t.due):hhmm(t.due)}</div>
  <div class="grow"><b>${esc(c.name)}</b><small>${esc(t.text)}${d?' · '+esc(d.name):''}</small>${over?`<div class="late">Trễ ${dur(S.now-t.due)}</div>`:''}</div>
  <div class="acts"><button class="btn sm" data-act="done" data-id="${t.id}">Xong</button><button class="btn sm pri" data-act="doneLog" data-id="${t.id}">Xong và ghi nhanh</button><button class="btn sm" data-act="resched" data-id="${t.id}">Dời hạn</button></div></div>`}
function viewToday(){
 const k=K(),ov=overdueTasks(),td=todayTasks(),dn=doneTasks();
 if(k==='gd')return `<div class="banner info">Giám đốc chỉ xem báo cáo, không có việc cá nhân trên màn hình Hôm nay.</div>${emptyToday()}`;
 const need=ov.length+td.length;
 return `<div class="cards">
  <div class="card"><small>Việc cần làm</small><b>${need}</b></div>
  <div class="card ${ov.length?'red':''}"><small>Quá hạn</small><b>${ov.length}</b></div>
  <div class="card"><small>Đã xong hôm nay</small><b>${dn.length}</b></div>
  <div class="card" style="display:flex;align-items:center;justify-content:center"><button class="btn pri" data-act="newLog">+ Ghi nhanh</button></div></div>
 ${need===0?emptyToday():''}
 ${ov.length?`<div class="sec"><h3 class="red">Quá hạn (${ov.length})</h3>${ov.map(t=>taskRow(t,true)).join('')}</div>`:''}
 ${td.length?`<div class="sec"><h3>Hôm nay · ${DAYS[dow(S.now)]} (${td.length})</h3>${td.map(t=>taskRow(t,false)).join('')}</div>`:''}
 ${dn.length?`<div class="sec"><h3>Đã xong hôm nay (${dn.length})</h3>${dn.map(t=>`<div class="row"><div class="tm" style="color:var(--grn)">${hhmm(t.doneAt)}</div><div class="grow"><b>${esc(cust(t.cust).name)}</b><small>${esc(t.text)}</small></div><span class="tag grn">Đã xong</span></div>`).join('')}</div>`:''}
 <div class="legend">Mỗi người chỉ thấy việc của mình. Quá hạn là việc chưa làm có hạn trước giờ demo (trạng thái suy ra, không lưu thành cột). Cảnh báo là thông báo trong ứng dụng, không gửi Zalo hay email.</div>`}
function emptyToday(){return `<div class="sec"><div class="empty">Hôm nay không có việc</div></div>`}

/* ===== Hồ sơ khách (drawer) ===== */
function viewCusts(){
 const list=custs.filter(canSeeCust);
 return `${K()==='nv'?'<div class="banner info">Nhân viên KD chỉ thấy khách mình phụ trách.</div>':''}${K()==='kt'?'<div class="banner info">Kỹ thuật chỉ thấy khách đã được gửi form bàn giao.</div>':''}${K()==='ktoan'?'<div class="banner info">Kế toán chỉ thấy khách đã ký.</div>':''}${K()==='mkt'?'<div class="banner warn">Marketing không có quyền xem hồ sơ khách (chỉ nhập lead).</div>':''}
 ${(K()==='tp'||K()==='nv')?`<div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px">${K()==='tp'?'<button class="btn" data-act="imOpen">Nhập khách từ Google Sheet</button>':''}<button class="btn pri" data-act="cfOpen">+ Tạo khách</button></div>`:''}
 <div class="sec"><table><tr><th>Khách hàng</th><th>Phụ trách</th><th>Giai đoạn</th><th>Deal mở</th><th></th></tr>
 ${list.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small style="color:var(--mut)">${esc(c.contact)} · ${esc(c.phone)}</small></td><td>${esc(ownerName(c))}</td><td><span class="tag ${c.stage==='Đã ký'?'grn':'blu'}">${c.stage}</span></td><td>${openDeals(c.id).length}</td><td style="text-align:right"><button class="btn sm" data-act="openCust" data-id="${c.id}">Mở hồ sơ</button></td></tr>`).join('')||'<tr><td colspan=5><div class="empty">Chưa có khách</div></td></tr>'}</table></div>`}
/* ===== Hồ sơ khách hàng thống nhất + dòng thời gian (T-27; FR-09, US-M5-10..12, BR-19, A-24..A-26) ===== */
const vnd=n=>n.toLocaleString('vi-VN')+' ₫';
/* Phần hồ sơ mỗi vai trò được xem (A-26, BR-19). Kế toán, Kỹ thuật không thấy nội dung chăm sóc; Kỹ thuật không thấy giá trị deal, thanh toán, hóa đơn */
const SEE=sec=>{const k=K();return({value:k!=='kt',pay:k!=='kt',inv:k!=='kt',care:k!=='kt'&&k!=='ktoan',hand:k!=='ktoan'&&k!=='mkt',disc:k==='nv'||k==='tp'||k==='gd'})[sec]};
const EV_TYPES=()=>{const k=K();return k==='kt'?['handoff','delivery']:k==='ktoan'?['create','stage','pay','handoff','delivery','invoice']:null};
const EV_TAG={create:'',care:'blu',stage:'amb',pay:'grn',handoff:'',delivery:'blu',invoice:'blu'};
const PAY_TAG={'Chưa thanh toán':'amb','Đã cọc':'blu','Đã tất toán':'grn'};
/* Dòng thời gian dựng từ dữ liệu có sẵn, không nhập thêm (NFR-02); chỉ thêm dòng, không sửa, không xóa */
function evsOf(cid){
 const c=cust(cid),out=[];
 out.push({t:c.createdAt,by:c.createdBy,type:'create',label:'Tạo hồ sơ',text:'Hồ sơ khách được tạo.',deal:null});
 logs.filter(l=>l.cust===cid).forEach(l=>out.push({t:l.t,by:l.by,type:'care',label:'Chăm sóc',text:l.ch+' · '+l.rs+(l.note?' · '+l.note:'')+(l.next?' · Hẹn lần sau '+fmt(l.next):''),deal:l.deal}));
 dealHist.filter(h=>deal(h.deal).cust===cid).forEach(h=>out.push({t:h.t,by:h.by,type:'stage',label:'Đổi giai đoạn deal',text:h.from+' → '+h.to,deal:h.deal}));
 deals.filter(d=>d.cust===cid).forEach(d=>(d.payHist||[]).forEach(p=>out.push({t:p.t,by:p.by,type:'pay',label:'Thanh toán',text:'Xác nhận '+p.to,deal:d.id})));
 handoffs.filter(f=>f.cust===cid).forEach(f=>{
  f.sendLog.forEach((t,i)=>out.push({t,by:f.by,type:'handoff',label:i?'Gửi lại bàn giao':'Gửi bàn giao',text:'Form bàn giao gửi sang Kỹ thuật',deal:f.deal}));
  f.returns.forEach(r=>out.push({t:r.at,by:r.by,type:'handoff',label:'Trả lại bàn giao',text:r.reason+(r.note?': '+r.note:''),deal:f.deal}));
  if(f.recvAt)out.push({t:f.recvAt,by:f.recvBy,type:'handoff',label:'Nhận bàn giao',text:'Kỹ thuật xác nhận Đã nhận',deal:f.deal});
  f.dhist.forEach(x=>out.push({t:x.t,by:x.by,type:'delivery',label:'Đổi trạng thái triển khai',text:'→ '+x.to+(x.day!=null?' · ngày nghiệm thu '+fmtDay(x.day):'')+(x.note?' · '+x.note:''),deal:f.deal}))});
 invHist.filter(x=>x.cust===cid).forEach(x=>out.push({t:x.t,by:x.by,type:'invoice',label:x.label,text:x.text,deal:null}));
 return out.filter(e=>e.t<=S.now)}
const stl=(label,html)=>`<div class="st"><span>${label}</span><div>${html}</div></div>`;
function delTag(f){
 if(!f)return '<span class="tag">Chưa bàn giao</span>';
 if(f.state==='recv')return `<span class="tag ${f.dstate==='Đã nghiệm thu'?'grn':'blu'}">${esc(f.dstate)}</span>`;
 if(f.state==='back')return '<span class="tag amb">Chờ nhận bàn giao</span><span class="tag red">Cần bổ sung</span>';
 return hoOver(f)?'<span class="tag amb">Chờ nhận bàn giao</span><span class="tag red">Quá hạn xác nhận</span>':'<span class="tag amb">Chờ nhận bàn giao</span>'}
function dealBlock(d,c){
 const signed=d.stage==='Đã ký',f=signed?formOf(d.id):null,ld=d.lead?leads.find(l=>l.id===d.lead):null;
 let btn='';
 if(f)btn=`<button class="btn sm" data-act="viewHo" data-id="${f.id}">Xem form</button>`;
 else if(canSend(c)&&d.stage!=='Thua')btn=`<button class="btn sm ${signed?'pri':'soft'}" data-act="startHo" data-deal="${d.id}">Bàn giao</button>`;
 const hd=f&&SEE('hand')?`<div class="kv2" style="margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)"><span>Địa chỉ lắp đặt</span><b style="grid-column:span 3">${esc(f.addr)}</b><span>Liên hệ tại chỗ</span><b>${esc(f.contact)}</b><span>Điện thoại</span><b>${esc(fmtPhone(f.phone))}</b><span>Khung giờ tiếp cận</span><b>${esc(f.hours.replace('-',' - '))}</b>${f.infra?`<span>Lưu ý hạ tầng</span><b style="grid-column:span 3">${esc(f.infra)}</b>`:''}</div>`:'';
 return `<div class="dealblk"><div class="dh2"><b style="flex:1">${esc(d.name)}</b>${d.owner!==c.owner?`<span class="tag">giữ ${esc(ROLES[d.owner].short)}</span>`:''}${canStage(d)?`<button class="btn sm" data-act="stageOpen" data-deal="${d.id}">Đổi giai đoạn</button>`:''}</div>
 ${SEE('value')?`<div class="kv2"><span>Giá trị</span><b>${d.val==null?'Chưa có':vnd(d.val)}</b><span>Ngày ký</span><b>${signed?fmt(d.signedAt):'Chưa ký'}</b>${signed&&SEE('disc')?`<span>Giảm giá áp dụng</span><b>${d.disc==null?'Chưa ghi':m1(d.disc)+'%'}</b>`:''}<span>Nguồn</span><b>${esc(d.src||'Chưa xác định')}</b><span>Chiến dịch</span><b>${ld?esc(ld.camp):'<span style="color:var(--mut);font-weight:400">Không có (deal tạo trực tiếp)</span>'}</b></div>`:''}
 <div class="sts">
  ${SEE('value')?stl('Thương mại',`<span class="tag ${signed?'grn':d.stage==='Thua'?'red':'amb'}">${d.stage}</span>${SEE('disc')&&dcPend(d.id)?'<span class="tag amb">Chờ duyệt giảm giá</span>':''}`):''}
  ${SEE('pay')?stl('Thanh toán',(signed?`<span class="tag ${PAY_TAG[d.pay]}">${d.pay}</span>`:'<span class="tag">Chưa áp dụng</span>')+(K()==='ktoan'&&signed&&d.pay!=='Đã tất toán'?`<button class="btn sm pri" data-act="payOpen" data-deal="${d.id}">Xác nhận thanh toán</button>`:'')):''}
  ${stl('Triển khai',(signed?delTag(f):'<span class="tag">Chưa áp dụng</span>')+(f&&f.state==='recv'&&f.dhist.length?`<small style="color:var(--mut)">${esc(f.dhist[f.dhist.length-1].by)} cập nhật ${fmt(f.dhist[f.dhist.length-1].t)}${f.acceptDay!=null?' · Ngày nghiệm thu '+fmtDay(f.acceptDay):''}</small>`:'')+btn+(K()==='kt'&&f&&f.state==='recv'&&f.dstate!=='Đã nghiệm thu'?`<button class="btn sm pri" data-act="delOpen" data-id="${f.id}">Cập nhật triển khai</button>`:''))}
 </div>${hd}${SEE('disc')?dcBlock(d,c):''}</div>`}
function drawerHtml(){
 const c=cust(S.drawer);if(!c)return '';
 const k=K(),can=canLog(c),types=EV_TYPES();
 const ds=deals.filter(d=>d.cust===c.id).sort((a,b)=>b.created-a.created);
 const base=evsOf(c.id).filter(e=>!types||types.includes(e.type));
 const all=base.filter(e=>!S.drawerDeal||e.deal===S.drawerDeal||e.deal===null).sort((a,b)=>b.t-a.t);
 const shown=all.slice(0,S.tlN),inv=INV[c.id]||{};
 const iv=(label,v)=>`<span>${label}</span><b>${v?esc(v):'<span style="color:var(--mut);font-weight:400">Chưa có</span>'}</b>`;
 return `<div class="ov" style="background:rgba(15,23,42,.25);justify-content:flex-end;padding:0;z-index:39" data-act="closeDrawer"></div>
 <div class="drawer"><div class="dh"><div style="flex:1"><b style="font-size:16px">${esc(c.name)}</b><div style="color:var(--mut);font-size:13px;margin-top:2px">Liên hệ chính: ${esc(c.contact)} · ${esc(c.phone)} · Phụ trách: ${esc(ownerName(c))}${c.src?' · Nguồn: '+esc(c.src):''}</div></div>${SEE('value')?`<span class="tag ${c.stage==='Đã ký'?'grn':'blu'}">${c.stage}</span>`:''}<button class="btn sm" data-act="closeDrawer">Đóng</button></div>
 <div class="db"><div class="sech" style="margin-top:0">Deal (${ds.length})</div>
 ${ds.length?ds.map(d=>dealBlock(d,c)).join(''):'<div class="note">Chưa có deal</div>'}
 ${SEE('inv')?`<div class="sech" style="display:flex;align-items:center;gap:8px"><span style="flex:1">Thông tin xuất hóa đơn</span>${invSent[c.id]?'<span class="tag grn">Đã chuyển Kế toán</span>':''}${canInv(c)?`<button class="btn sm" data-act="invOpen" data-id="${c.id}">Sửa</button>${invSent[c.id]?'':`<button class="btn sm pri" data-act="invSend" data-id="${c.id}" ${hasSigned(c.id)?'':'disabled title="Chỉ chuyển Kế toán khi khách có deal Đã ký"'}>Chuyển Kế toán</button>`}`:''}</div><div class="kv2" style="grid-template-columns:130px 1fr 130px 1fr">${iv('Tên pháp lý',inv.legal)}${iv('Mã số thuế',inv.tax)}${iv('Địa chỉ trụ sở',inv.addr)}${iv('Email nhận hóa đơn',inv.email)}</div><div class="note" style="margin-top:-2px">${invSent[c.id]?'Đã chuyển Kế toán bởi '+esc(invSent[c.id].by)+' lúc '+fmt(invSent[c.id].t)+'. Từ đây bốn trường không được để trống; mọi thay đổi gửi thông báo cho Kế toán.':canInv(c)?(hasSigned(c.id)?'Cần đủ bốn trường để chuyển Kế toán.':'Chỉ chuyển Kế toán khi khách có deal “Đã ký”.'):'Chỉ xem. Nhân viên KD phụ trách khách và Trưởng phòng KD mới sửa được.'}</div>`:''}
 <div style="display:flex;align-items:center;gap:8px;margin:16px 0 10px"><b style="font-size:13px;flex:1">Dòng thời gian (${all.length})</b>
  ${ds.length>=2?`<select data-chg="drawerDeal" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px"><option value="">Tất cả deal</option>${ds.map(d=>`<option value="${d.id}" ${S.drawerDeal===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:''}
  ${can&&SEE('care')?`<button class="btn sm pri" data-act="logCust" data-id="${c.id}">Ghi nhanh</button>`:''}</div>
 ${!SEE('care')?`<div class="note" style="margin:-4px 0 10px">${k==='kt'?'Kỹ thuật':'Kế toán'} không xem nội dung chăm sóc khách (A-26); dòng thời gian chỉ gồm các sự kiện thuộc phần bạn được xem.</div>`:''}
 ${!can&&k==='cskh'?'<div class="note" style="margin:-4px 0 10px">CSKH chỉ ghi nhanh khi khách đã ở “Đã ký”.</div>':''}
 ${!can&&k==='gd'?'<div class="note" style="margin:-4px 0 10px">Giám đốc chỉ xem.</div>':''}
 ${shown.map(e=>`<div class="log"><div class="lt"><b>${fmt(e.t)}</b><span class="tag ${EV_TAG[e.type]}">${e.label}</span><small>${esc(e.by)}</small></div><div>${esc(e.text)}</div>${e.deal?`<small>Deal: ${esc(deal(e.deal).name)}</small>`:''}</div>`).join('')||'<div class="empty">Chưa có sự kiện</div>'}
 ${all.length>shown.length?`<button class="btn" style="width:100%" data-act="tlMore">Xem thêm (còn ${all.length-shown.length} sự kiện)</button>`:''}
 ${SEE('care')&&!base.some(e=>e.type==='care')?'<div class="note">Chưa có lịch sử chăm sóc</div>':''}
 </div></div>`}

/* ===== M4: Ghi nhanh (modal) ===== */
let QL=null,qlTimer=null;
function openQL(o){
 const c=o.cust?cust(o.cust):null;
 QL={cust:o.cust||'',deal:o.deal||'',ch:'',rs:'',day:'',time:'10:00',note:'',t0:performance.now(),task:o.task||null};
 if(c&&!o.deal){const od=openDeals(c.id);if(od.length===1)QL.deal=od[0].id}
 const allowed=custs.filter(x=>canLog(x));
 const m=document.getElementById('modal');
 m.innerHTML=`<div class="ov"><div class="md"><div class="mh"><b>Ghi nhanh kết quả trao đổi</b><span class="timer" id="qlT">0 giây</span><button class="x" data-act="closeModal">×</button></div>
 <div class="mb"><div id="qlCust"></div>
 <div class="fld"><label>Kênh <i>*</i></label><div class="chips">${CHANNELS.map(v=>`<button class="chip" data-act="qlPick" data-k="ch" data-v="${v}">${v}</button>`).join('')}</div></div>
 <div class="fld"><label>Kết quả <i>*</i></label><div class="chips">${RESULTS.map(v=>`<button class="chip" data-act="qlPick" data-k="rs" data-v="${v}">${v}</button>`).join('')}</div></div>
 <div class="fld"><label>Hẹn lần sau <span id="qlReq" style="color:var(--red)"></span></label><div class="two"><select id="qlDay" data-chg="qlDay"><option value="">Không đặt hẹn</option>${[0,1,2].map(i=>`<option value="${i}">${['Hôm nay','Ngày mai','Ngày kia'][i]} · ${DAYS[dow(S.now+i*D)]}</option>`).join('')}</select><input type="time" id="qlTime" value="10:00" data-chg="qlTime"></div></div>
 <div class="fld"><label>Ghi chú (không bắt buộc)</label><textarea id="qlNote" maxlength="500" data-chg="qlNote"></textarea><div class="note" id="qlCnt">0/500</div></div>
 <div class="err" id="qlErr"></div></div>
 <div class="mf"><button class="btn" data-act="closeModal">Hủy</button><button class="btn pri" data-act="saveQL">Lưu</button></div></div></div>`;
 window._allowed=allowed;syncQL();
 clearInterval(qlTimer);qlTimer=setInterval(()=>{const s=Math.round((performance.now()-QL.t0)/1000),e=document.getElementById('qlT');if(e){e.textContent=s+' giây';e.className='timer '+(s>30?'bad':'')}},500);
}
function qlCustHtml(){
 const c=QL.cust?cust(QL.cust):null;
 let h='';
 if(!QL.fixedCust&&!QL.locked){h+=`<div class="fld"><label>Khách hàng <i>*</i></label><select data-chg="qlCust"><option value="">Chọn khách…</option>${window._allowed.map(x=>`<option value="${x.id}" ${x.id===QL.cust?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}
 else if(c)h+=`<div class="fld"><label>Khách hàng</label><div class="fixed"><b>${esc(c.name)}</b></div></div>`;
 if(c){const od=openDeals(c.id);
  if(od.length===1)h+=`<div class="fld"><label>Deal</label><div class="fixed">Tự gắn vào: <b>${esc(od[0].name)}</b></div></div>`;
  else if(od.length>=2)h+=`<div class="fld"><label>Deal</label><select data-chg="qlDeal"><option value="">Ghi chung cho khách (không gắn deal)</option>${od.map(d=>`<option value="${d.id}" ${d.id===QL.deal?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>`;
  else h+=`<div class="fld"><label>Deal</label><div class="fixed">Khách chưa có deal mở, ghi chung cho khách.</div></div>`}
 return h}
function syncQL(){
 if(!QL)return;
 document.getElementById('qlCust').innerHTML=qlCustHtml();
 document.querySelectorAll('#modal .chip').forEach(b=>b.classList.toggle('on',QL[b.dataset.k]===b.dataset.v));
 document.getElementById('qlReq').textContent=NEEDS_NEXT.includes(QL.rs)?'(bắt buộc, BR-10)':'';
 document.getElementById('qlCnt').textContent=QL.note.length+'/500';
}
function saveQL(){
 const err=m=>{document.getElementById('qlErr').textContent=m;return false};
 if(!QL.cust)return err('Chưa chọn khách hàng.');
 const c=cust(QL.cust);if(!canLog(c))return err('Bạn không có quyền ghi nhanh cho khách này.');
 if(!QL.rs)return err('Chưa chọn kết quả.');
 if(!QL.ch)return err('Chưa chọn kênh.');
 let next=null;
 if(QL.day!==''){const [h,mi]=(QL.time||'').split(':').map(Number);if(isNaN(h))return err('Chưa nhập giờ hẹn.');next=dayIdx(S.now)*D+Number(QL.day)*D+h*60+mi;if(next<=S.now)return err('Giờ hẹn phải sau thời điểm hiện tại.')}
 else if(NEEDS_NEXT.includes(QL.rs))return err('Kết quả “'+QL.rs+'” bắt buộc đặt hẹn lần sau (BR-10).');
 const sec=Math.round((performance.now()-QL.t0)/1000);
 const lg={id:'g'+(logs.length+1),cust:QL.cust,deal:QL.deal||null,t:S.now,by:R().short,ch:QL.ch,rs:QL.rs,note:QL.note.trim(),next};
 logs.push(lg);
 if(next)tasks.push({id:'t'+(tasks.length+1),owner:S.role,cust:QL.cust,deal:QL.deal||null,text:'Gọi lại',due:next,status:'todo',log:lg.id});
 closeModal();render();

function doRedist(){

function submitHF(){
 const v={addr:hv('hfAddr').trim(),contact:hv('hfContact').trim(),phone:hv('hfPhone').trim(),start:hv('hfStart'),end:hv('hfEnd'),infra:hv('hfInfra').trim()};
 let f=HF.id?handoffs.find(x=>x.id===HF.id):null;
 const dl=deal(f?f.deal:HF.deal),c=cust(dl.cust);
 if(!canSend(c)){toast('Chỉ Nhân viên KD phụ trách khách và Trưởng phòng KD được gửi form bàn giao.',true);return}
 if(dl.stage!=='Đã ký'){toast('Chỉ bàn giao khi deal đã “Đã ký”.',true);return}
 if(!f&&handoffs.some(x=>x.deal===dl.id)){closeModal();toast('Deal đã có form bàn giao, hệ thống từ chối tạo form mới.',true);return}
 if(f&&f.state!=='back'){closeModal();toast('Form không ở trạng thái “Cần bổ sung” nên không gửi lại được.',true);return}
 const e=validateHF(v);showHFErrors(e);
 if(Object.keys(e).length)return;
 const rec={addr:v.addr,contact:v.contact,phone:normPhone(v.phone),hours:v.start+'-'+v.end,infra:v.infra};
 if(f){Object.assign(f,rec,{state:'wait',sentAt:S.now,due:addWork(S.now,SLA_MIN),byKey:S.role,by:R().short});f.sendLog.push(S.now);
  notify('kt','Bàn giao gửi lại: '+c.name+' · '+dl.name+' (gửi bởi '+f.by+'). Hạn xác nhận '+fmt(f.due)+'.',{page:'ho'})}
 else{f=Object.assign({id:'h'+(handoffs.length+1),deal:dl.id,cust:c.id,byKey:S.role,by:R().short,sentAt:S.now,due:addWork(S.now,SLA_MIN),state:'wait',recvBy:null,recvAt:null,dstate:'Chờ nhận bàn giao',returns:[],sendLog:[S.now],dhist:[]},rec);
  handoffs.push(f);notify('kt','Bàn giao mới: '+c.name+' · '+dl.name+' (gửi bởi '+f.by+'). Hạn xác nhận '+fmt(f.due)+'.',{page:'ho'})}
 closeModal();render();
 toast('Đã gửi form bàn giao. Trạng thái: Chờ nhận bàn giao, hạn xác nhận '+fmt(f.due)+' (4 giờ làm việc). Kỹ thuật nhận thông báo trong ứng dụng.');
}

function recvHo(id){
 const f=handoffs.find(x=>x.id===id);
 if(K()!=='kt'){toast('Chỉ vai trò Kỹ thuật được bấm “Đã nhận”.',true);return}
 if(f.state==='recv'){closeModal();render();toast('Form đã được nhận bởi '+f.recvBy+' lúc '+fmt(f.recvAt)+'. Hệ thống không ghi thêm.',true);return}
 if(f.state!=='wait'){toast('Form đang ở “Cần bổ sung”, chưa nhận được.',true);return}
 const was=hoOver(f);
 f.state='recv';f.recvBy=R().short;f.recvAt=S.now;f.dstate='Đã nhận bàn giao';
 notify(f.byKey,'Kỹ thuật đã nhận bàn giao '+cust(f.cust).name+' · '+deal(f.deal).name+'.',{form:f.id});
 closeModal();render();
 toast('Đã nhận bàn giao. Trạng thái triển khai: Đã nhận bàn giao; form bị khóa; '+esc(f.by)+' nhận thông báo.'+(was?' Dấu quá hạn đã mất, thời gian xác nhận thực tế lưu để so với SLA.':''));
}
function openRet(id){

 <div class="fld"><label>Lý do <i>*</i></label><select id="retReason" data-chg="retReason"><option value="">Chọn lý do…</option>${HO_REASONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
 <div class="fld"><label>Ghi chú <span id="retReq" style="color:var(--red)"></span></label><textarea id="retNote" maxlength="255"></textarea></div>
 <div class="err" id="retErr"></div></div>

function saveRet(){
 const f=handoffs.find(x=>x.id===RET.id),r=hv('retReason'),n=hv('retNote').trim(),err=m=>{document.getElementById('retErr').textContent=m};
 if(K()!=='kt')return err('Chỉ vai trò Kỹ thuật được trả lại form.');
 if(f.state==='recv')return err('Form đã “Đã nhận”, chỉ trả lại được trước khi nhận.');
 if(!r)return err('Lý do trả lại là bắt buộc.');
 if(r==='Khác'&&!n)return err('Lý do “Khác” bắt buộc nhập ghi chú.');
 f.state='back';f.returns.push({by:R().short,at:S.now,reason:r,note:n});
 notify(f.byKey,'Kỹ thuật trả lại bàn giao '+cust(f.cust).name+' · '+deal(f.deal).name+': '+r+'.',{form:f.id});
 closeModal();render();toast('Đã trả lại form, trạng thái “Cần bổ sung”. '+esc(f.by)+' nhận thông báo; trạng thái triển khai của khách vẫn là Chờ nhận bàn giao.');
}

function parseCSV(t){
 const rows=[],sep=(t.split('\n')[0]||'').includes('\t')?'\t':',';let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;
  else if(ch===sep){r.push(f);f=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}
  else f+=ch}
 r.push(f);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}

 if(miss.length){res.innerHTML=`<div class="errsum"><b>Không nhập dòng nào.</b> File thiếu cột bắt buộc: ${miss.map(k=>'“'+(k==='name'?'Tên người liên hệ':'Số điện thoại')+'”').join(', ')}.</div>`;return}
 const get=(r,k)=>idx[k]<0?'':String(r[idx[k]]||'').trim();
 const okl=[],errs=[],dups=[],seen=new Set();
 rows.slice(1).forEach((r,i)=>{const no=i+2,name=get(r,'name').replace(/\s+/g,' '),ph=get(r,'phone'),why=[];
  if(!name)why.push('thiếu tên người liên hệ');
  let pn='';
  if(!ph)why.push('thiếu số điện thoại');else{pn=normPhone(ph);if(pn===null||!/^0\d{9,10}$/.test(pn))why.push('số điện thoại sai định dạng')}
  if(why.length){errs.push({no,name,why:why.join('; ')});return}
  const ex=leads.find(l=>l.st==='Mới'&&digits(l.phone)===pn);
  if(ex){dups.push({no,name,ref:'lead “'+ex.name+'” đang chờ phân bổ'});return}
  if(seen.has(pn)){dups.push({no,name,ref:'dòng trước trong file'});return}
  seen.add(pn);
  const src=get(r,'src'),camp=get(r,'camp');
  okl.push({id:'li'+(++lidN),name,co:get(r,'co')||'Chưa xác định',phone:ph.replace(/\s+/g,' '),src:SOURCES.includes(src)?src:'Chưa xác định',camp:camp||'Chưa xác định',t:S.now,st:'Mới',imp:true})});
 okl.forEach(l=>leads.push(l));
 if(okl.length)notify('tp','Có '+okl.length+' lead mới từ file chờ phân bổ.',{page:'lead'});

 res.innerHTML=`<div class="sum"><b>${okl.length} thành công, ${errs.length} lỗi, ${dups.length} trùng bị bỏ qua.</b>${okl.length?'<br>Lead mới vào hàng chờ phân bổ của Trưởng phòng KD, Trưởng phòng KD nhận thông báo.':''}</div>
 ${errs.length?'<b style="font-size:13px">Dòng lỗi (không nhập)</b>'+tbl(['Dòng','Người liên hệ','Lý do'],errs):''}
 ${dups.length?'<b style="font-size:13px">Dòng trùng (bỏ qua)</b>'+tbl(['Dòng','Người liên hệ','Trùng với'],dups):''}`;
 render();toast('Đã nhập lead: '+okl.length+' thành công, '+errs.length+' lỗi, '+dups.length+' trùng.')}

 invSent[cid]={by:R().short,t:S.now};invHist.push({cust:cid,t:S.now,by:R().short,label:'Chuyển Kế toán',text:'Thông tin xuất hóa đơn chuyển sang Kế toán: '+x.legal+' · MST '+x.tax});
 notify('ktoan','Khách '+c.name+' chuyển thông tin xuất hóa đơn: '+x.legal+' · MST '+x.tax+'.',{cust:cid});
 render();toast('Đã chuyển thông tin xuất hóa đơn sang Kế toán. Kế toán nhận thông báo; sự kiện ghi vào dòng thời gian.')}

/* ===== D-01: mở thông báo, đánh dấu đã đọc, đi tới đúng màn hình (US-M5-07 AC2) ===== */
function openNotif(i){
 const n=myNotifs()[i];if(!n)return;
 const x=n.nid?notifs.find(y=>y.id===n.nid):null;if(x)x.read=true;
 const l=n.link;
 if(l){if(l.cust){goCust(l.cust);return}
  if(l.form){render();openHFView(l.form);return}
  if(l.page){S.page=l.page;if(l.tab)S.tab=l.tab;if(l.hoTab)S.hoTab=l.hoTab}}
 render()}

const ACT={
 page:d=>{S.page=d.p;S.notif=false;render()},
 bell:()=>{S.notif=!S.notif;render()},
 openCust:d=>{const c=cust(d.id);if(!canSeeCust(c)){toast({mkt:'Marketing không có quyền xem hồ sơ khách.',kt:'Kỹ thuật chỉ xem được khách đã được gửi form bàn giao.',ktoan:'Kế toán chỉ xem được khách đã ký.'}[K()]||'Bạn chỉ xem được khách mình phụ trách.',true);return}S.drawer=d.id;S.drawerDeal='';S.tlN=20;render()},
 tlMore:()=>{S.tlN+=20;render()},
 closeDrawer:()=>{S.drawer=null;render()},
 done:d=>{const t=tasks.find(x=>x.id===d.id);if(t.owner!==S.role){toast('Chỉ người được giao việc mới hoàn thành được.',true);return}t.status='done';t.doneAt=S.now;render();toast('Đã hoàn thành việc. Việc rời danh sách cần làm.')},
 doneLog:d=>{const t=tasks.find(x=>x.id===d.id);if(t.owner!==S.role){toast('Chỉ người được giao việc mới hoàn thành được.',true);return}t.status='done';t.doneAt=S.now;render();const c=cust(t.cust);if(!canLog(c)){toast('Việc đã xong, nhưng bạn không có quyền ghi nhanh cho khách này.',true);return}openQL({cust:t.cust,deal:t.deal,task:t.id});QL.locked=true;syncQL()},
 resched:d=>openResched(d.id),saveResched:()=>saveResched(),
 newLog:()=>{openQL({})},
 logCust:d=>{openQL({cust:d.id});QL.locked=true;syncQL()},
 qlPick:d=>{QL[d.k]=d.v;document.getElementById('qlErr').textContent='';syncQL()},
 saveQL:()=>saveQL(),closeModal:()=>closeModal(),
 tab:d=>{S.tab=d.t;render()},
 selAll:()=>{queue().forEach(l=>S.sel.add(l.id));render()},
 assign:()=>doAssign(),
 rAll:()=>{custs.filter(c=>c.owner===S.redist.from).forEach(c=>S.redist.sel.add(c.id));render()},
 redist:()=>doRedist(),
 toggleActive:()=>{if(K()!=='tp'){toast('Chỉ Trưởng phòng KD được đánh dấu nghỉ việc.',true);return}const e=EMP[S.redist.from];e.active=!e.active;S.redist.sum=null;render()},
 startHo:d=>startHandoff(d.deal),viewHo:d=>openHFView(d.id),editHo:d=>openHFEdit(d.id),
 recvHo:d=>recvHo(d.id),retHo:d=>openRet(d.id),saveRet:()=>saveRet(),submitHF:()=>submitHF(),
 hoTab:d=>{S.hoTab=d.t;render()},
 dcTab:d=>{S.dcTab=d.t;render()},dcNew:d=>dcOpen(d.deal),dcSend:()=>dcSend(),dcOk:d=>dcApprove(d.id),dcRejOpen:d=>dcRejOpen(d.id),dcRej:()=>dcRej(),signDeal:d=>signDeal(d.deal),signConfirm:()=>signConfirm(),
 openNotif:d=>openNotif(Number(d.i)),
 cfOpen:()=>cfOpen(),cfSave:()=>cfSave(false),cfForce:()=>cfSave(true),cfOpenDup:d=>{closeModal();goCust(d.id)},
 liOpen:()=>liOpen(),liRun:()=>liRun(),liSample:()=>{document.getElementById('liText').value=LI_SAMPLE;document.getElementById('liRes').innerHTML=''},
 imOpen:()=>imOpen(),imRun:()=>imRun(),imSample:()=>{document.getElementById('imText').value=IM_SAMPLE;document.getElementById('imRes').innerHTML=''},
 convLead:d=>convertLead(d.id),lcNew:()=>{const id=LC.id;closeModal();doConvert(id,null)},lcAttach:()=>{const id=LC.id,to=LC.dup;closeModal();doConvert(id,to)},
 stageOpen:d=>stageOpen(d.deal),stageSave:()=>stageSave(),
 delOpen:d=>delOpen(d.id),delSave:()=>delSave(),
 payOpen:d=>payOpen(d.deal),paySave:()=>paySave(),
 invOpen:d=>invOpen(d.id),invSave:()=>invSave(),invSend:d=>invSend(d.id)
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(S.notif&&el.dataset.act!=='bell'){S.notif=false}
 ACT[el.dataset.act]&&ACT[el.dataset.act](el.dataset,e)});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-chg]');if(!el)return;const v=el.value,k=el.dataset.chg;
 if(k==='role'){S.role=v;S.drawer=null;S.notif=false;S.sel.clear();if(K()==='tp'&&S.page==='lead'&&!['queue','assigned','redist'].includes(S.tab))S.tab='queue';if(K()!=='tp'&&S.tab==='redist')S.tab='queue';if(K()==='kt'&&S.page==='today')S.page='ho';if(K()==='ktoan'&&S.page==='today')S.page='cust';render()}
 else if(k==='per'){S.per=v;render()}
 else if(k==='kg'){S.kg=Number(v);render()}
 else if(k==='kc'){S.kc=Number(v);render()}
 else if(k==='clock'){if(v==='')return;S.now=Number(v);S.sel.clear();render()}
 else if(k==='clkDay'||k==='clkTime'){const di=Number(document.getElementById('clkDay').value),tv=(document.getElementById('clkTime').value||'00:00').split(':').map(Number);S.now=di*D+tv[0]*60+tv[1];S.sel.clear();render()}
 else if(k==='liFile'){const fl=el.files[0];if(fl){const rd=new FileReader();rd.onload=()=>{document.getElementById('liText').value=String(rd.result)};rd.readAsText(fl)}}
 else if(k==='imFile'){const fl=el.files[0];if(fl){const rd=new FileReader();rd.onload=()=>{document.getElementById('imText').value=String(rd.result)};rd.readAsText(fl)}}
 else if(SG&&k==='sgTo'){document.getElementById('sgLost').style.display=v==='Thua'?'block':'none';document.getElementById('sgErr').textContent=''}
 else if(DL&&k==='dlTo'){document.getElementById('dlDayW').style.display=v==='Đã nghiệm thu'?'block':'none';document.getElementById('dlErr').textContent=''}
 else if(k==='drawerDeal'){S.drawerDeal=v;S.tlN=20;render()}
 else if(k==='selLead'){el.checked?S.sel.add(el.dataset.id):S.sel.delete(el.dataset.id);render()}
 else if(k==='assignTo'){S.assignTo=v;render()}
 else if(k==='reassign'){const l=leads.find(x=>x.id===el.dataset.id);if(K()!=='tp'){toast('Chỉ Trưởng phòng KD được đổi người phụ trách.',true);render();return}l.owner=v;notify(v,'Bạn được giao lead '+l.name+'.',{page:'lead'});render();toast('Đã đổi người phụ trách lead sang '+EMP[v].name+'.')}
 else if(k==='rFrom'){S.redist.from=v;S.redist.sel.clear();S.redist.sum=null;render()}
 else if(k==='rTo'){S.redist.to=v;render()}
 else if(k==='rSel'){el.checked?S.redist.sel.add(el.dataset.id):S.redist.sel.delete(el.dataset.id);render()}
 else if(QL&&k==='qlCust'){QL.cust=v;QL.deal='';if(v){const od=openDeals(v);if(od.length===1)QL.deal=od[0].id}syncQL()}
 else if(QL&&k==='qlDeal'){QL.deal=v}
 else if(QL&&k==='qlDay'){QL.day=v;document.getElementById('qlErr').textContent=''}
 else if(QL&&k==='qlTime'){QL.time=v}
 else if(RET&&k==='retReason'){document.getElementById('retReq').textContent=v==='Khác'?'(bắt buộc)':'';document.getElementById('retErr').textContent=''}
});
document.addEventListener('input',e=>{if(QL&&e.target.id==='qlNote'){QL.note=e.target.value;document.getElementById('qlCnt').textContent=QL.note.length+'/500'}
 if(HF){const id=e.target.id;if(id==='hfInfra'){const c=document.getElementById('hfCnt');if(c)c.textContent=e.target.value.length+'/255'}
  const k=ID_FLD[id];if(k){const w=document.getElementById('fld-'+k),m=document.getElementById('err-'+k);if(w)w.classList.remove('bad');if(m)m.textContent=''}}});
render();
</script>
